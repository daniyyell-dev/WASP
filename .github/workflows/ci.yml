name: public-code-checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q scripts
      - run: python scripts/validate_release.py --help
      - run: python scripts/reproduce_metrics.py --help
      - run: python scripts/render_figures.py --help
      - run: python scripts/train_autoencoder.py --help

